{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete account | LocalConnect Admin</title>
    <link rel="stylesheet" href="{% static 'css/custom_admin.css' %}">
</head>
<body class="admin-page">
    <header class="admin-topbar">
        <div class="admin-topbar-inner">
            <a class="admin-brand" href="{% url 'directory_admin_dashboard' %}"><span class="admin-brand-mark" aria-hidden="true">L</span><span>LocalConnect / Admin</span></a>
            <nav class="admin-topbar-nav" aria-label="Administration">
                <a href="{% url 'directory_admin_dashboard' %}">Directory</a>
                <a href="{% url 'directory_admin_users' %}" aria-current="page">User accounts</a>
                <a href="{% url 'home' %}">View site</a>
            </nav>
        </div>
    </header>
    <main class="admin-shell">
        <section class="admin-confirm-panel">
            <p class="admin-kicker">Confirm account removal</p>
            <h1>Delete {{ user_to_delete.username }}?</h1>
            <p class="admin-warning-copy">This permanently removes the account and may also remove records owned by this user.</p>
            <form method="post" class="admin-button-row">
                {% csrf_token %}
                <button type="submit" class="admin-button admin-button-danger">Delete account</button>
                <a href="{% url 'directory_admin_users' %}" class="admin-button">Cancel</a>
            </form>
        </section>
    </main>
</body>
</html>
